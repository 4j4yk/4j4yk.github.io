name: Post new blog posts to LinkedIn

on:
  push:
    paths:
      - 'content/posts/**'         # adjust if you publish elsewhere
      - 'content/el5/**'
      - 'content/api/**'
      - 'content/books/**'
      # optionally include other folders

jobs:
  post_to_linkedin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Find latest added post
        id: latest
        run: |
          POST_FILE=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^content/posts/' | head -n1)
          echo "post_file=$POST_FILE" >> $GITHUB_OUTPUT
          echo "Found post file: $POST_FILE"

      - name: Extract Title & URL
        id: extract
        run: |
          FILE="${{ steps.latest.outputs.post_file }}"
          if [ -z "$FILE" ]; then
            echo "No new post found. Exiting."
            exit 0
          fi
          TITLE=$(grep '^title:' "$FILE" | sed 's/title: *\"//;s/\"$//')
          URL="${{ github.event.repository.homepage }}${FILE%.md}/"
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Post update to LinkedIn
        if: steps.extract.outputs.title != ''
        run: |
          echo "Posting '$TITLE' to LinkedIn..."
          curl -X POST https://api.linkedin.com/v2/ugcPosts \
            -H "Authorization: Bearer ${{ secrets.LINKEDIN_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            -d '{
              "author": "${{ secrets.LINKEDIN_AUTHOR_ID }}",
              "lifecycleState": "PUBLISHED",
              "specificContent": {
                "com.linkedin.ugc.ShareContent": {
                  "shareCommentary": {
                    "text": "New blog post: '"$TITLE"'\nRead it here: '"$URL"'"
                  },
                  "shareMediaCategory": "ARTICLE"
                }
              },
              "visibility": {
                "com.linkedin.ugc.MemberNetworkVisibility": "PUBLIC"
              }
            }'
