<script>
    // Source: https://github.com/adityatelange/hugo-PaperMod/discussions/943
    // START hamburger menu
    let b = document.querySelector("#menu-trigger")
    let m = document.querySelector(".menu")
    b.addEventListener("click", function () {
        m.classList.toggle("hidden")
    });
    // hide menu when clicked outside
    document.body.addEventListener('click', function (event) {
        if (!b.contains(event.target)) {
            m.classList.add("hidden")
        }
    });
    // END hamburger menu
</script>

<script>
    (() => {
        const eyes = document.querySelector('.site-eyes');
        const finePointer = window.matchMedia('(pointer: fine)');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        if (eyes && finePointer.matches && !reducedMotion.matches) {
            let pointerFrame;
            let latestPointer;
            let blinkTimer;

            const centerEyes = () => {
                eyes.style.setProperty('--eye-x', '0px');
                eyes.style.setProperty('--eye-y', '0px');
            };

            const moveEyes = () => {
                pointerFrame = undefined;
                if (!latestPointer) return;

                const bounds = eyes.getBoundingClientRect();
                const deltaX = latestPointer.clientX - (bounds.left + bounds.width / 2);
                const deltaY = latestPointer.clientY - (bounds.top + bounds.height / 2);
                const angle = Math.atan2(deltaY, deltaX);
                const distance = Math.min(4, Math.hypot(deltaX, deltaY) / 28);

                eyes.style.setProperty('--eye-x', `${Math.cos(angle) * distance}px`);
                eyes.style.setProperty('--eye-y', `${Math.sin(angle) * distance}px`);
            };

            const followPointer = (event) => {
                latestPointer = event;
                if (!pointerFrame) pointerFrame = window.requestAnimationFrame(moveEyes);
            };

            const scheduleBlink = () => {
                blinkTimer = window.setTimeout(() => {
                    if (!document.hidden) {
                        eyes.classList.add('is-blinking');
                        window.setTimeout(() => eyes.classList.remove('is-blinking'), 340);
                    }
                    scheduleBlink();
                }, 4500 + Math.random() * 4000);
            };

            document.addEventListener('pointermove', followPointer, { passive: true });
            document.documentElement.addEventListener('mouseleave', centerEyes);
            window.addEventListener('blur', centerEyes);
            scheduleBlink();

            window.addEventListener('pagehide', () => {
                window.clearTimeout(blinkTimer);
                if (pointerFrame) window.cancelAnimationFrame(pointerFrame);
            }, { once: true });
        }

        const filterButtons = [...document.querySelectorAll('.project-filter')];
        const projectCards = [...document.querySelectorAll('.project-card')];

        filterButtons.forEach((button) => {
            button.addEventListener('click', () => {
                const filter = button.dataset.filter;

                filterButtons.forEach((item) => {
                    const isActive = item === button;
                    item.classList.toggle('is-active', isActive);
                    item.setAttribute('aria-pressed', String(isActive));
                });

                projectCards.forEach((card) => {
                    const matches = filter === 'all' || card.dataset.projectTerms.includes(filter);
                    card.hidden = !matches;
                });
            });
        });

        if (window.location.pathname.includes('/posts/') && document.querySelector('.post-single')) {
            const progress = document.createElement('div');
            progress.className = 'reading-progress';
            progress.setAttribute('role', 'progressbar');
            progress.setAttribute('aria-label', 'Article reading progress');
            progress.setAttribute('aria-valuemin', '0');
            progress.setAttribute('aria-valuemax', '100');
            document.body.appendChild(progress);

            const updateProgress = () => {
                const scrollable = document.documentElement.scrollHeight - window.innerHeight;
                const value = scrollable > 0 ? Math.min(100, Math.max(0, (window.scrollY / scrollable) * 100)) : 100;
                progress.style.width = `${value}%`;
                progress.setAttribute('aria-valuenow', String(Math.round(value)));
            };

            updateProgress();
            window.addEventListener('scroll', updateProgress, { passive: true });
            window.addEventListener('resize', updateProgress);
        }

        document.querySelectorAll('.post-content img[alt*="The-Wraith"]').forEach((image) => {
            image.classList.add('rift-trigger');
            image.title = 'Click to open a rift';
            image.tabIndex = 0;
            image.setAttribute('role', 'button');
            image.setAttribute('aria-label', 'Animate The-Wraith entering a rift');

            const openRift = () => {
                if (image.classList.contains('rift-jumping')) return;
                image.classList.add('rift-jumping');

                const flash = document.createElement('div');
                flash.className = 'rift-flash';
                document.body.appendChild(flash);

                window.setTimeout(() => {
                    image.classList.remove('rift-jumping');
                    flash.remove();
                }, 900);
            };

            image.addEventListener('click', openRift);
            image.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    openRift();
                }
            });
        });
    })();
</script>
