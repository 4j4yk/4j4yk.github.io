baseURL: "https://4j4yk.github.io/"
title: Ajay / *-*
pagination.pagerSize: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Ajay / *-*
  description: "A results-driven professional with over 10 years of IT experience, specializing in business analysis, application development, and technical leadership."
  keywords: [Blog, Portfolio, PaperMod]
  author: "Ajay Khampariya"
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  mainSections:
    - posts
  ShowBreadCrumbs: true
  ShowReadingTime: true
  ShowPostNavLinks: true
  disableScrollToTop: false
  label:
    text: "Ajay Khampariya"
    icon: /apple-touch-icon.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "Hey, I’m Ajay 👋"
    Content: >
      Welcome to my personal space on the web.  
      I share **💭 thoughts**, **📚 books I’m reading**, and **📁 projects I’m working on**.

  socialIcons:
#    - name: x
#      url: "https://x.com/"
#    - name: stackoverflow
#      url: "https://stackoverflow.com"
    - name: github
      url: "https://github.com/4j4yk"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/akhampariya/"

  # analytics:
  #   google:
  #     SiteVerificationTag: "XYZabc"
  #   bing:
  #     SiteVerificationTag: "XYZabc"
  #   yandex:
  #     SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  # editPost:
  #   URL: "https://github.com/<path_to_repo>/content"
  #   Text: "Suggest Changes" # edit text
  #   appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  ShowSearch: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
# main menu
menu:
  main:
    - name: "About"
      url: "/about/"
      weight: 1

    - name: "💭 Thoughts"
      url: "/posts/"
      weight: 2

    - name: "📚 I'm Reading"
      url: "/books/"
      weight: 3

    - name: "📁 Projects"
      url: "/projects/"
      weight: 4

    - name: "🎈 EL5"
      url: "/el5/"
      weight: 5
    - name: "🎮 ⚽ 🎧"
      url: "/extra/"
      weight: 7
    # - name: "🔍 Search"
    #   url: "search"
    #   weight: 5

    - name: "⚡ Skills"
      url: "/skills/"
      weight: 6

    - name: "🔍 Research"
      url: "/research/"
      weight: 4

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

# TAXONOMIES
taxonomies:
  category: categories
  tag: tags
  series: series
